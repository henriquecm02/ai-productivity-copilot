[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.1.0"
description = "Copiloto de produtividade via MCP: tarefas, notas, agenda e extração de tarefas com IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2", "google-genai>=1.0", "python-dotenv>=1.0", "python-dateutil>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
copilot-mcp = "copilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 280

[tool.ruff.lint]
select = ["E", "F", "W"]
